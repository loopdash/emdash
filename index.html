<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emdash</title>
  <meta name="description" content="— — — — — — — — —">

  <meta property="og:title" content="Emdash">
  <meta property="og:description" content="— — — — — — — — —">
  <meta property="og:image" content="/meta-og.jpg">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yourdomain.com">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Emdash">
  <meta name="twitter:description" content="— — — — — — — — —">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="merged.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    /* Unified reveal — body holds at opacity 0 until the merged scene image
       and the three.js monolith are both ready, then fades up together. */
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      opacity: 0;
      transition: opacity 0.8s ease-out;
    }
    body.ready { opacity: 1; }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px rgba(255,255,255,0.05) inset !important;
      -webkit-text-fill-color: white !important;
    }
    /* Single-image scene — merged.jpg already contains the full composition
       (mountains, sky, foreground). `cover` fills the viewport; anchoring at
       the top keeps the mountain peaks in frame at every aspect ratio. */
    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
      background-image: url('merged.jpg');
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
    }
    .monolith-scene {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      pointer-events: none;
      /* Anchor the slab ~50px below the treeline of merged.jpg.
         With background-size: cover + center top, image height in the viewport
         is max(100vw / 1.5, 100vh) — treeline sits at ~40% of that, so
         treeline_y = max(26.67vw, 40vh). The slab itself appears ~26% down
         from the canvas top, which is 0.087 × canvas_width. Canvas width uses
         the same clamp() below — clamp is continuous, so the formula stays
         continuous and the slab never jumps at any viewport size. */
      padding-top: calc(max(26.67vw, 40vh) + 62px - clamp(24.36px, 7.83vw, 53.94px));
    }
    /* Desktop: nudge the slab lower so it lands on the yellow field from the
       start, instead of straddling the treeline. */
    @media (min-width: 768px) {
      .monolith-scene {
        padding-top: calc(max(26.67vw, 40vh) + 122px - clamp(24.36px, 7.83vw, 53.94px));
      }
    }
    .monolith-wrapper {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
    }
    #monolith-canvas {
      display: block;
      width: clamp(280px, 90vw, 620px);
      aspect-ratio: 720 / 240;
      height: auto;
      /* Soft top mask so the slab can descend from above without showing
         a hard canvas-edge crossing during the entrance. */
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 8%, black 18%, black 100%);
              mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 8%, black 18%, black 100%);
    }
    /* CSS oval ground shadow — sits inside the wrapper so it tracks the
       canvas wherever the centered scene places it. Scale/opacity breathe
       with the slab's hover (driven from the three.js frame loop). */
    .monolith-shadow {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: clamp(200px, 34vw, 540px);
      height: clamp(30px, 5.5vw, 96px);
      transform: translate(-50%, 50%) scale(1);
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0.62) 0%,
        rgba(0, 0, 0, 0.42) 38%,
        rgba(0, 0, 0, 0.20) 62%,
        rgba(0, 0, 0, 0.06) 82%,
        rgba(0, 0, 0, 0) 100%
      );
      filter: blur(16px);
      pointer-events: none;
      z-index: 3;
      opacity: 0;
      will-change: transform, opacity;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      opacity: 0;
    }
    body.ready .fade-in {
      animation: fade-up 1.2s ease forwards;
    }
    #global-tone {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.03);
    }
  </style>
</head>
<body class="bg-black">
  <div class="relative flex flex-col" style="height:100dvh;overflow:hidden;">

    <div id="scene"></div>

    <!-- Three.js monolith -->
    <div class="monolith-scene">
      <div class="monolith-wrapper">
        <canvas id="monolith-canvas"></canvas>
        <!-- CSS ground shadow lives inside the wrapper so it tracks the
             centered canvas. Animated by the three.js frame loop. -->
        <div class="monolith-shadow" id="monolith-shadow"></div>
      </div>
    </div>

    <main class="relative z-10 flex-1"></main>

    <footer class="relative z-20 px-8 pb-8 flex justify-center">
      <a
        href="mailto:info@emdashlabs.com"
        class="text-white/70 text-xs tracking-widest uppercase underline underline-offset-4 fade-in"
        style="animation-delay:1.8s;cursor:pointer;transition:color 0.4s cubic-bezier(0,0,1,1), text-decoration-color 0.4s cubic-bezier(0,0,1,1);text-shadow:0 1px 6px rgba(0,0,0,0.45);"
        onmouseover="this.style.color='rgba(255,255,255,0.95)'"
        onmouseout="this.style.color='rgba(255,255,255,0.7)'"
      >
        Contact Us
      </a>
    </footer>

    <div id="global-tone"></div>

  </div>

  <script>
    // Unified reveal coordinator — body stays hidden until window.load and
    // the three.js warm-up render both fire. Then we add `.ready` and reset
    // the three.js clock so the slab's entrance begins from t=0 the moment
    // the body becomes visible. 5s safety timeout reveals anyway.
    window.__threeReadyPromise__ = new Promise(function (r) {
      window.__threeReady__ = r;
    });
    function __reveal__() {
      if (document.body.classList.contains('ready')) return;
      if (window.__threeClock__ && window.__threeClock__.start) {
        window.__threeClock__.start();
      }
      document.body.classList.add('ready');
    }
    Promise.all([
      new Promise(function (r) {
        if (document.readyState === 'complete') r();
        else window.addEventListener('load', r);
      }),
      window.__threeReadyPromise__
    ]).then(__reveal__);
    setTimeout(__reveal__, 5000);
  </script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.165.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.165.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const canvas = document.getElementById('monolith-canvas');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: true,
      powerPreference: 'high-performance'
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0xb8c8c0, 7.4, 11.4);

    // Environmental reflection map — vertical bands sampled from the scene:
    // sky at top, haze, ridge, mid-ground green, deep grass at the base.
    const envCanvas = document.createElement('canvas');
    envCanvas.width = 512;
    envCanvas.height = 256;
    const ectx = envCanvas.getContext('2d');
    const envGrad = ectx.createLinearGradient(0, 0, 0, 256);
    envGrad.addColorStop(0.00, '#7fb8dc');
    envGrad.addColorStop(0.38, '#a8c8d8');
    envGrad.addColorStop(0.48, '#b8c4ac');
    envGrad.addColorStop(0.58, '#7a9248');
    envGrad.addColorStop(0.78, '#4a6028');
    envGrad.addColorStop(1.00, '#2c3a18');
    ectx.fillStyle = envGrad;
    ectx.fillRect(0, 0, 512, 256);

    const envTex = new THREE.CanvasTexture(envCanvas);
    envTex.mapping = THREE.EquirectangularReflectionMapping;
    envTex.colorSpace = THREE.SRGBColorSpace;

    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromEquirectangular(envTex).texture;
    envTex.dispose();
    pmrem.dispose();
    if ('environmentIntensity' in scene) scene.environmentIntensity = 0.85;

    const camera = new THREE.PerspectiveCamera(17, 720 / 240, 0.1, 100);
    camera.position.set(0, 0.55, 8);
    camera.lookAt(0, -0.02, 0);

    // Thinner slab — width:height = 10:1 emdash silhouette.
    const slabGeo = new RoundedBoxGeometry(4.8, 0.48, 0.55, 6, 0.04);
    const slabMat = new THREE.MeshPhysicalMaterial({
      color: 0x1f2820,
      metalness: 0.42,
      roughness: 0.42,
      clearcoat: 0.55,
      clearcoatRoughness: 0.48,
      reflectivity: 0.55,
      sheen: 0.4,
      sheenColor: 0xa89878,
      sheenRoughness: 0.6,
      transparent: true,
      opacity: 0
    });
    slabMat.onBeforeCompile = (shader) => {
      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <dithering_fragment>',
        `
        #include <dithering_fragment>
        vec3 vDir = normalize(vViewPosition);
        float fres = pow(1.0 - clamp(dot(vDir, normal), 0.0, 1.0), 2.5);
        float upFace = clamp(normal.y, 0.0, 1.0);
        float downFace = clamp(-normal.y, 0.0, 1.0);
        vec3 skyTint   = vec3(0.498, 0.722, 0.863);
        vec3 hazeTint  = vec3(0.722, 0.784, 0.753);
        vec3 grassTint = vec3(0.478, 0.572, 0.282);
        vec3 atmos = mix(hazeTint, skyTint, upFace * 0.7);
        atmos = mix(atmos, grassTint, downFace * 0.45);
        gl_FragColor.rgb = mix(gl_FragColor.rgb, atmos, fres * 0.26);
        gl_FragColor.rgb = mix(gl_FragColor.rgb, hazeTint, fres * fres * 0.10);
        float grain = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5;
        gl_FragColor.rgb += grain * 0.022;
        `
      );
    };

    const slab = new THREE.Mesh(slabGeo, slabMat);
    scene.add(slab);

    const shadowEl = document.getElementById('monolith-shadow');

    scene.add(new THREE.HemisphereLight(0x9cc8e0, 0x445028, 0.65));

    const key = new THREE.DirectionalLight(0xf6dcae, 3.1);
    key.position.set(3.8, 4.7, 2.2);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0x9cb4b0, 1.05);
    rim.position.set(-3.6, 1.8, -2.6);
    scene.add(rim);

    const fill = new THREE.DirectionalLight(0x8ca44c, 0.32);
    fill.position.set(-1.4, -0.3, 3.2);
    scene.add(fill);

    const sheen = new THREE.PointLight(0xd0c098, 4.6, 14, 2);
    sheen.position.set(0.9, 2.6, 1.4);
    scene.add(sheen);

    const skyScatter = new THREE.DirectionalLight(0xa8cce8, 0.55);
    skyScatter.position.set(0.2, 5, 0.4);
    scene.add(skyScatter);

    function resize() {
      const rect = canvas.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    resize();
    new ResizeObserver(resize).observe(canvas);

    const clock = new THREE.Clock();
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
    const ENTER = 3.0;
    const HOVER = 0.5;
    const SHADOW_BASE_OPACITY = 1.0;

    function frame() {
      const t = clock.getElapsedTime();

      const e = reduceMotion ? 1 : Math.min(1, t / ENTER);
      const ease = easeOutCubic(e);
      // Descend from above the resting position while opacity ramps from 0 —
      // the slab is invisible during the high portion of the fall, so the
      // top edge never reads as a hard line crossing the canvas.
      const enterY = (1 - ease) * 1.4;
      // Opacity eases in faster than the fall so the slab is already partly
      // visible during the final settle, giving the "fade in from the top"
      // read without a pop-in.
      const opacity = Math.min(1, ease * 1.15);

      // Procedural motion — layered sines at incommensurable frequencies so
      // the loop never visibly repeats. Time-based only — no cursor follow.
      const bobY   = Math.sin(t * 0.45)        * 0.18
                   + Math.cos(t * 0.22 + 0.4)  * 0.04
                   + Math.sin(t * 0.36 + 1.3)  * 0.015;
      const driftX = Math.sin(t * 0.14 + 0.6)  * 0.018
                   + Math.cos(t * 0.31 + 1.9)  * 0.006;
      const driftY = Math.cos(t * 0.18 + 0.2)  * 0.008;
      const wobX   = Math.sin(t * 0.23)        * 0.005
                   + Math.cos(t * 0.43 + 0.4)  * 0.002;
      const wobY   = Math.sin(t * 0.15 + 0.9)  * 0.007
                   + Math.cos(t * 0.36 + 0.8)  * 0.003;
      const wobZ   = Math.cos(t * 0.21)        * 0.004
                   + Math.sin(t * 0.39 + 1.1)  * 0.002;

      const blend = reduceMotion ? 0 : ease;

      slab.position.x = driftX * blend;
      slab.position.y = HOVER + enterY + (bobY + driftY) * blend;
      slab.rotation.x = wobX * blend;
      slab.rotation.y = wobY * blend;
      slab.rotation.z = wobZ * blend;

      slabMat.opacity = opacity;

      const verticalDelta = slab.position.y - HOVER;
      const breath = -verticalDelta;
      const shadowScale = Math.max(0.6, Math.min(1.15, 1 + breath * 0.18));
      const shadowAlpha = Math.max(0, Math.min(1, 1 + breath * 0.35)) * opacity * SHADOW_BASE_OPACITY;
      shadowEl.style.transform = `translate(-50%, 50%) scale(${shadowScale.toFixed(3)})`;
      shadowEl.style.opacity = shadowAlpha.toFixed(3);

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }

    renderer.render(scene, camera);
    window.__threeClock__ = clock;
    if (window.__threeReady__) window.__threeReady__();

    requestAnimationFrame(frame);
  </script>
</body>
</html>
