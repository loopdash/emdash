<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emdash</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&family=Roboto+Serif:ital,opsz,wght@0,8..144,300;0,8..144,400;0,8..144,500;1,8..144,300&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto Serif', serif; }
    input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 30px rgba(255,255,255,0.05) inset !important;
      -webkit-text-fill-color: white !important;
    }
    .monolith-scene {
      position: absolute;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      pointer-events: none;
    }
    .monolith-title {
      font-family: 'Instrument Serif', serif;
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      color: rgba(255,255,255,0.92);
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .monolith-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }
    .monolith-float {
      position: relative;
      animation:
        monolith-enter 3s cubic-bezier(0.2, 0.8, 0.3, 1) both,
        monolith-float 6s ease-in-out 3s infinite;
    }
    /* slab spans x:72–648, y:48–163 within 720×200 canvas */
    .monolith-blur-layer {
      position: absolute;
      left: 10%;
      right: 10%;
      top: 24%;
      height: 57.5%;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    #monolith-canvas {
      display: block;
      width: 72vw;
      max-width: 720px;
      height: auto;
      margin: 0 auto;
    }
    /* canvas has ~28px blank below the slab; bottom:-12px puts shadow ~40px below the slab */
    .ground-shadow {
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 80%;
      height: 40px;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 40%, transparent 70%);
      border-radius: 50%;
      filter: blur(18px);
      animation:
        shadow-enter  3s ease both,
        shadow-breath 6s ease-in-out 3s infinite;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      opacity: 0;
      animation: fade-up 1.2s ease forwards;
    }
    @keyframes monolith-enter {
      from { transform: translateY(-120px); opacity: 0; }
      to   { transform: translateY(0px);    opacity: 1; }
    }
    @keyframes monolith-float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-10px); }
    }
    @keyframes shadow-enter {
      from { transform: translateX(-50%) scale(0.15); opacity: 0; }
      to   { transform: translateX(-50%) scale(1);    opacity: 1; }
    }
    /* inverse of float — largest/darkest when craft is at its lowest */
    @keyframes shadow-breath {
      0%, 100% { transform: translateX(-50%) scale(1);    opacity: 1; }
      50%       { transform: translateX(-50%) scale(0.4);  opacity: 0.15; }
    }
  </style>
</head>
<body class="bg-black">
  <div class="relative min-h-screen flex flex-col">

    <!-- Background image -->
    <div
      class="absolute inset-0 bg-cover bg-center bg-no-repeat"
      style="background-image: url('example_1_removed.png')"
    ></div>

    <!-- Gradient overlay — heavier at bottom so text sits clean -->
    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-black/40"></div>

    <!-- CSS/canvas monolith + title -->
    <div class="monolith-scene">
      <div class="text-center">
        <h1 class="monolith-title fade-in" style="animation-delay:0.8s;">Emdash</h1>
        <p class="text-white/70 text-base font-light tracking-wide mt-3 fade-in" style="font-family:'Roboto',sans-serif;animation-delay:1.2s;">Its origin and purpose are still a total mystery.</p>
      </div>
      <div class="monolith-wrapper">
        <div class="monolith-float">
          <canvas id="monolith-canvas" width="720" height="200"></canvas>
        </div>
        <div class="ground-shadow"></div>
      </div>
    </div>

    <!-- Main content — vertically centered -->
    <main class="relative z-10 flex-1 flex items-end justify-center px-6 pb-14">
      <div class="text-center max-w-lg">
        <a
          href="mailto:mike@emdashlabs.com"
          class="inline-flex items-center justify-center rounded-full text-white text-sm font-light tracking-widest uppercase px-5 pt-3 pb-2.5 transition-colors fade-in"
          style="font-family:'Roboto',sans-serif;background:rgba(250,250,252,0.25);backdrop-filter:saturate(180%) blur(3px);-webkit-backdrop-filter:saturate(180%) blur(3px);animation-delay:1.8s;transition:background 0.2s ease;"
          onmouseover="this.style.background='rgba(250,250,252,0.45)'"
          onmouseout="this.style.background='rgba(250,250,252,0.25)'"
        >
          Learn More
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 px-8 pb-8 flex justify-between items-end">
      <span class="text-white/20 text-xs tracking-widest font-light">© 2026</span>
    </footer>

  </div>

  <script>
    (function () {
      const canvas = document.getElementById('monolith-canvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width;   // 720
      const H = canvas.height;  // 200

      const seed = 42;
      function rand(i) { return ((Math.sin(i * 127.1 + seed * 311.7) * 43758.5453) % 1 + 1) % 1; }

      // ── Face geometry ──────────────────────────────────────────────────
      //
      // 72 ──────────────────────────────── 648  y=38  ← top of front face
      // |            front face              |
      // 72 ──────────────────────────────── 648  y=138 ← seam front/bottom
      //  \  bottom face (viewed from below) /
      //  108 ────────────────────────────── 612  y=166

      const FF = { tl:{x:72,y:38},  tr:{x:648,y:38},  bl:{x:72,y:138}, br:{x:648,y:138} };
      const BF = { fl:{x:72,y:138}, fr:{x:648,y:138}, bl:{x:108,y:166},br:{x:612,y:166} };

      function face(pts) {
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        pts.slice(1).forEach(p => ctx.lineTo(p.x, p.y));
        ctx.closePath();
        ctx.fill();
      }

      // ── Front face — opaque ────────────────────────────────────────────
      const frontGrad = ctx.createLinearGradient(0, FF.tl.y, 0, FF.bl.y);
      frontGrad.addColorStop(0,    '#1c1c1c');
      frontGrad.addColorStop(0.4,  '#0b0b0b');
      frontGrad.addColorStop(0.75, '#080808');
      frontGrad.addColorStop(1,    '#121212');
      ctx.fillStyle = frontGrad;
      face([FF.tl, FF.tr, FF.br, FF.bl]);

      // ── Bottom face — darkest, in shadow, angled to show depth ────────
      const botGrad = ctx.createLinearGradient(0, BF.fl.y, 0, BF.bl.y);
      botGrad.addColorStop(0, '#0e0e0e');
      botGrad.addColorStop(1, '#040404');
      ctx.fillStyle = botGrad;
      face([BF.fl, BF.fr, BF.br, BF.bl]);

      // ── Edge strokes for crisp face separation ─────────────────────────
      function stroke(p1, p2, rgba) {
        ctx.strokeStyle = rgba;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
      stroke(FF.tl, FF.tr, 'rgba(255,255,255,0.10)'); // top edge highlight
      stroke(FF.bl, FF.br, 'rgba(255,255,255,0.06)'); // front/bottom seam
      stroke(BF.bl, BF.br, 'rgba(0,0,0,0.5)');        // bottom back edge

      // ── Vertical striations on front face ─────────────────────────────
      for (let i = 0; i < 14; i++) {
        const lx = FF.tl.x + rand(i) * (FF.tr.x - FF.tl.x);
        ctx.fillStyle = `rgba(0,0,0,${rand(i + 100) * 0.10})`;
        ctx.fillRect(lx, FF.tl.y, 1 + rand(i + 200), FF.bl.y - FF.tl.y);
      }

      // ── Grain noise over entire slab bounding box ──────────────────────
      const nx = FF.tl.x, ny = FF.tl.y;
      const nw = FF.tr.x - FF.tl.x, nh = BF.bl.y - FF.tl.y;
      const imgData = ctx.getImageData(nx, ny, nw, nh);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] > 0) {
          const n = (rand(i) - 0.5) * 44;
          d[i]     = Math.max(0, Math.min(255, d[i]     + n));
          d[i + 1] = Math.max(0, Math.min(255, d[i + 1] + n));
          d[i + 2] = Math.max(0, Math.min(255, d[i + 2] + n));
        }
      }
      ctx.putImageData(imgData, nx, ny);

    })();
  </script>
</body>
</html>
